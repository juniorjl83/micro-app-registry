# Datasource (will be overridden by docker‑compose env vars)
spring.datasource.url=jdbc:postgresql://localhost:5432/microappdb
spring.datasource.username=app_user
spring.datasource.password=secret

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# JWT settings – the secret is injected from the environment variable JWT_SECRET
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=3600000

# Server
server.port=8080